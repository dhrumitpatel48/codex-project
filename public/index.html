<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Data Platform</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Professional Data Platform</h1>
        <p>Securely manage health professional records and subscriptions.</p>
      </header>

      <section class="card">
        <h2>1) Authenticate</h2>
        <button id="loginBtn">Sign in anonymously</button>
        <p id="authState">Not signed in.</p>
      </section>

      <section class="card">
        <h2>2) Save Profile</h2>
        <form id="profileForm">
          <input name="fullName" placeholder="Full name" required />
          <input name="profession" placeholder="Profession" required />
          <input name="licenseNumber" placeholder="License number" required />
          <input name="country" placeholder="Country" required />
          <input name="phone" placeholder="Phone (optional)" />
          <button type="submit">Save profile</button>
        </form>
        <pre id="profileResult"></pre>
      </section>

      <section class="card">
        <h2>3) Activate Subscription</h2>
        <p>Use your Stripe price ID from the dashboard.</p>
        <input id="priceId" placeholder="price_..." />
        <button id="subscribeBtn">Go to secure checkout</button>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
